<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Snovanta Systems logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b1f3a"/>
  <!-- six connected nodes: a "systems" network that also reads as a snowflake -->
  <g stroke="url(#g)" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="32" y1="32" x2="32" y2="13"/>
    <line x1="32" y1="32" x2="48.5" y2="22.5"/>
    <line x1="32" y1="32" x2="48.5" y2="41.5"/>
    <line x1="32" y1="32" x2="32" y2="51"/>
    <line x1="32" y1="32" x2="15.5" y2="41.5"/>
    <line x1="32" y1="32" x2="15.5" y2="22.5"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="32" cy="13" r="4"/>
    <circle cx="48.5" cy="22.5" r="4"/>
    <circle cx="48.5" cy="41.5" r="4"/>
    <circle cx="32" cy="51" r="4"/>
    <circle cx="15.5" cy="41.5" r="4"/>
    <circle cx="15.5" cy="22.5" r="4"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="#ffffff"/>
</svg>
